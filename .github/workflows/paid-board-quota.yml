name: Internal paid-board quota tests

on:
  pull_request:
    paths:
      - paid_board_quota.py
      - internal_board_reservations.py
      - tests/test_paid_board_quota.py
      - tests/test_internal_board_reservations.py
      - .github/workflows/paid-board-quota.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paid-board-quota:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only required API dependency
        run: python -m pip install 'fastapi==0.142.2'
      - name: Run internal quota regression tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -v -s tests -p 'test_paid_board_quota.py'
          python -m unittest discover -v -s tests -p 'test_internal_board_reservations.py'
