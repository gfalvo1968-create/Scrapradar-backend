name: Membership security tests
on:
  push:
    branches: [feature/signal-day-entitlement-guard]
  pull_request:
    paths:
      - 'customer_accounts.py'
      - 'entitlement_policy.py'
      - 'paypal_live_evidence.py'
      - 'membership_catalog.py'
      - 'membership_records.py'
      - 'tests/**'
      - '.github/workflows/membership-security.yml'
permissions:
  contents: read
jobs:
  membership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run all offline tests
        run: python -m unittest discover -s tests -v
